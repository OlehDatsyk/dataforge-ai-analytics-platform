# Optional local PostgreSQL. The application itself runs through setup and start scripts.
# Set POSTGRES_PASSWORD in your shell or .env, then:
#   docker compose up -d
#   DATABASE_URL=postgresql://dataforge:<your password>@localhost:5432/dataforge
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dataforge
      POSTGRES_USER: dataforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dataforge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataforge -d dataforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dataforge_postgres:
